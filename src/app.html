<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="brisca-error" style="display:none;padding:1rem;font-family:monospace;background:#1a1a1a;color:#f87171;position:fixed;inset:0;z-index:9999;overflow:auto;white-space:pre-wrap"></div>
		<script>
			function showError(msg) {
				var el = document.getElementById('brisca-error');
				if (el) { el.style.display = 'block'; el.textContent += msg + '\n'; }
			}
			window.addEventListener('error', function(e) {
				showError('[error] ' + e.message + ' (' + e.filename + ':' + e.lineno + ')');
			});
			window.addEventListener('unhandledrejection', function(e) {
				showError('[unhandledrejection] ' + (e.reason?.message || e.reason || String(e)));
			});
		</script>
		<div class="brisca-app">%sveltekit.body%</div>
	</body>
</html>
